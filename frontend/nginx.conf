worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Preserve only an exact HTTP scheme supplied by Coolify's sanitized proxy
    # request. Direct/invalid values fall back to the scheme observed here.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        http    http;
        https   https;
    }

    map $forwarded_proto $forwarded_port {
        default 80;
        https   443;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        charset utf-8;
        server_tokens off;
        client_max_body_size 64m;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ^~ /api/ {
            # Compose places this gateway and the API on a dedicated internal network;
            # Uvicorn trusts only this gateway's configured static peer address.
            proxy_pass http://api:8000;
            proxy_http_version 1.1;

            # Never pass or append client-supplied forwarding identity. Coolify is
            # the outer proxy; the API receives only this gateway's immediate peer.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header Forwarded "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\.(?!well-known/) {
            deny all;
        }

        location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
