worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Preserve only an exact HTTP scheme supplied by Coolify's sanitized proxy
    # request. Direct/invalid values fall back to the scheme observed here.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        http    http;
        https   https;
    }

    map $forwarded_proto $forwarded_port {
        default 80;
        https   443;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS resolver (127.0.0.11) is only reachable at runtime,
    # when this container is attached to the Compose network where the "api"
    # service lives. The variable form of the proxy directive below forces nginx
    # to defer upstream DNS resolution to request time instead of resolving it
    # during `nginx -t` at image build time, which would otherwise fail with
    # "host not found in upstream api" because "api" does not exist in the
    # build-time DNS context.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        charset utf-8;
        server_tokens off;
        client_max_body_size 64m;

        # Suppress 404 noise for favicon requests — there is no favicon
        # asset in the build, so return 204 (No Content) instead of a
        # noisy 404 that floods the access log on every page load.
        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        # Vite dev-server artifacts (@vite/env, @vite/client, etc.) must
        # never be served in production. The SPA fallback previously served
        # index.html for these paths, making it look like the dev server
        # was still running. Return 404 instead.
        location ^~ /@vite/ {
            access_log off;
            log_not_found off;
            return 404;
        }

        # Block common scanner/framework probe paths that should never
        # resolve to a real page. Without this, the SPA fallback serves
        # index.html (200) for every path, generating noise in logs and
        # making the site look like it runs WordPress/Spring/PHP/etc.
        # Returns 404 instead of serving index.html.
        location ~* ^/(wp-login|wp-admin|wp-content|wp-includes|wp-json|xmlrpc|administrator|phpmyadmin|_profiler|debug/|actuator/|console/|\.env|\.git|\.aws|\.ssh|\.vscode|\.DS_Store|composer\.) {
            access_log off;
            log_not_found off;
            return 404;
        }

        # Any URI ending in a scanner-friendly file extension (.php, .asp,
        # .aspx, .jsp, .cgi, .pl, .py, .rb, .sh, .sql, .bak, .old, .swp,
        # .tmp, .env, .git, .svn, .yaml, .yml, .json config files) that does
        # NOT exist as a real static file should return 404, NOT the SPA
        # fallback index.html. This prevents scanners from getting a false
        # 200 on paths like /wp-login.php, /config.json.bak, etc.
        #
        # Note: we must be careful NOT to block legitimate static assets
        # (.css, .js, .png, etc.) — those are handled by the asset location
        # below with a 7-day cache.
        location ~* \.(php|asp|aspx|jsp|cgi|pl|py|rb|sh|sql|bak|old|swp|tmp|env|git|svn|yaml|yml|ini|conf|config|log|md|txt|tar|gz|zip|rar|7z|bz2)$ {
            access_log off;
            log_not_found off;
            try_files $uri =404;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ^~ /api/ {
            # Resolve the "api" service hostname at request time via Docker's
            # internal DNS (127.0.0.11) instead of at config-load time. The
            # variable form of the proxy directive (using $api_upstream) is what
            # makes nginx defer resolution; the literal form targeting "api"
            # directly would make `nginx -t` fail during image build because
            # "api" is only resolvable inside the Compose network at runtime.
            set $api_upstream "api:8000";
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;

            # Never pass or append client-supplied forwarding identity. Coolify is
            # the outer proxy; the API receives only this gateway's immediate peer.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header Forwarded "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_request_buffering off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\.(?!well-known/) {
            deny all;
        }

        location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
