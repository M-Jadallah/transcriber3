[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

# The real URL is read from DATABASE_URL by alembic/env.py.
# This placeholder prevents accidental use of a local database.
# Use the postgresql+psycopg:// prefix because only psycopg3 (psycopg[binary])
# is installed; the bare postgresql:// prefix would select psycopg2, which is
# not installed, and cause: ModuleNotFoundError: No module named 'psycopg2'.
sqlalchemy.url = postgresql+psycopg://unused:unused@localhost/unused

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
